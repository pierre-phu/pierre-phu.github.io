<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="alternate icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
      <nav aria-label="Main">
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
        <a href="https://github.com/{{ site.social.github }}">GitHub</a>
        <a href="https://www.linkedin.com/in/{{ site.social.linkedin }}/">LinkedIn</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© {{ site.time | date: "%Y" }} {{ site.author.name }}</p>
      <p>
        <a href="https://github.com/{{ site.social.github }}">GitHub</a>
        ·
        <a href="https://www.linkedin.com/in/{{ site.social.linkedin }}/">LinkedIn</a>
      </p>
    </div>
  </footer>

  <script>
    // Looping demo videos stay still for people who ask for reduced motion
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.querySelectorAll("video[autoplay]").forEach(function (video) {
        video.removeAttribute("autoplay");
        video.pause();
        video.controls = true;
      });
    }
  </script>
</body>
</html>
